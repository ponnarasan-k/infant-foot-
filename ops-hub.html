<title>Operations Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a fixed rail of modules on the left (a bottom tab bar on phones), one working list per view.
   Record numbers, dates and quantities are set in mono, like a shop-floor traveller. */
:root {
  --bg: #EEF2F4; --surface: #FFFFFF; --surface-2: #F5F8F9; --line: #D3DDE2;
  --fg: #13222C; --muted: #566975;
  --accent: #0C6B7A; --accent-fg: #FFFFFF; --accent-soft: #DAEDF0;
  --good: #1B7548; --good-soft: #DBF0E4;
  --warn: #8F5400; --warn-soft: #FAEACB;
  --crit: #B3261E; --crit-soft: #F9DDDA;
  --shade: rgba(19, 34, 44, .45);
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1519; --surface: #162026; --surface-2: #1B2830; --line: #2B3B45;
    --fg: #E3ECF0; --muted: #95A6B0;
    --accent: #5ABDCC; --accent-fg: #06262C; --accent-soft: #14373F;
    --good: #62CC95; --good-soft: #143326;
    --warn: #E9B25A; --warn-soft: #3A2C10;
    --crit: #F28B82; --crit-soft: #431A1B;
    --shade: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1519; --surface: #162026; --surface-2: #1B2830; --line: #2B3B45;
  --fg: #E3ECF0; --muted: #95A6B0;
  --accent: #5ABDCC; --accent-fg: #06262C; --accent-soft: #14373F;
  --good: #62CC95; --good-soft: #143326;
  --warn: #E9B25A; --warn-soft: #3A2C10;
  --crit: #F28B82; --crit-soft: #431A1B;
  --shade: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--sans); }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 24px; font-weight: 600; line-height: 1.2; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 600; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 12px 20px max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; }
.brand { padding: 0 8px 16px; }
.brand b { display: block; font-size: 16px; font-weight: 600; }
.brand span { font-size: 12px; color: var(--muted); }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: var(--fg); font-weight: 500; font-size: 14px; }
.nav:hover { background: var(--surface-2); }
.nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.badge { font: 500 11px/1 var(--mono); padding: 3px 6px; border-radius: 10px; background: var(--crit-soft); color: var(--crit); }
.badge.calm { background: var(--surface-2); color: var(--muted); }
.rail-foot { margin-top: auto; padding: 12px 8px 0; display: flex; flex-direction: column; gap: 8px; }

.main { min-width: 0; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.vh { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.vh-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; cursor: pointer; min-height: 38px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.small { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.btn.danger { color: var(--crit); }
.btn:disabled { opacity: .5; cursor: default; }
.linkbtn { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-weight: 500; color: var(--fg); }
.linkbtn:hover { color: var(--accent); text-decoration: underline; }

.banner { border: 1px solid var(--line); border-left: 4px solid var(--warn); background: var(--warn-soft); color: var(--fg); padding: 10px 14px; border-radius: 6px; font-size: 14px; }
.banner.info { border-left-color: var(--accent); background: var(--accent-soft); }

.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; text-decoration: none; color: var(--fg); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile b { font: 500 28px/1.1 var(--mono); }
.tile span { font-size: 13px; color: var(--muted); }
.tile.crit b { color: var(--crit); } .tile.warn b { color: var(--warn); } .tile.zero b { color: var(--muted); }

.cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel > header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.group-label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 10px 16px 6px; background: var(--surface-2); border-bottom: 1px solid var(--line); }

.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.row:last-child { border-bottom: 0; }
.row-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { overflow-wrap: anywhere; }
.row-meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row-side { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.row-actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.due { font: 500 13px/1 var(--mono); white-space: nowrap; }
.due.late { color: var(--crit); }

.pill { font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 10px; white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.crit { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 12px; font-size: 13px; font-weight: 500; cursor: pointer; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.toolbar select, .toolbar input[type="search"] { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 10px; min-height: 36px; font-size: 14px; max-width: 100%; }
.toolbar input[type="search"] { flex: 1 1 160px; min-width: 0; }

.steps { display: flex; gap: 3px; }
.steps i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.steps i.done { background: var(--accent); opacity: .5; }
.steps i.now { background: var(--accent); }
.card { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.card:last-child { border-bottom: 0; }
.card-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.card-top > div:first-child { min-width: 0; flex: 1 1 220px; }
.kv { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.kv b { color: var(--fg); font-weight: 500; }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty p { max-width: 46ch; }
.start { counter-reset: s; display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; }
.start li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.start li::before { content: counter(s); font: 500 13px/28px var(--mono); width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); text-align: center; }

.report { white-space: pre-wrap; font: 400 13px/1.6 var(--mono); padding: 16px; overflow-x: auto; margin: 0; }
textarea.notes { width: 100%; min-height: 140px; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--surface); resize: vertical; }
.field-row { display: flex; flex-wrap: wrap; gap: 10px; }
.field-row label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); flex: 1 1 140px; min-width: 0; }
.field-row input, .field-row select { border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; background: var(--surface); min-height: 38px; color: var(--fg); min-width: 0; width: 100%; }
.draft { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.draft input[type="checkbox"] { width: 18px; height: 18px; margin-top: 10px; }
.draft-fields { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.draft-fields input[type="text"] { flex: 1 1 100%; }
.draft-fields select, .draft-fields input[type="date"] { flex: 1 1 130px; }
.draft-fields input, .draft-fields select { border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; background: var(--surface); min-height: 38px; min-width: 0; }
details summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 500; }
.rag { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--good); }
.rag.amber { background: var(--warn); } .rag.red { background: var(--crit); }
.rag-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.rag-row:last-child { border-bottom: 0; }
.rag-row div { min-width: 0; }

.tabs { display: none; }
.overlay { position: fixed; inset: 0; background: var(--shade); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 40; }
.sheet { background: var(--surface); border-radius: 12px; width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; border: 1px solid var(--line); }
.sheet > header { padding: 16px 20px 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet form { padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
.sheet label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.sheet label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--fg); font-size: 14px; }
.sheet input:not([type="checkbox"]), .sheet select, .sheet textarea { border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; background: var(--surface); color: var(--fg); min-height: 40px; width: 100%; }
.sheet textarea { min-height: 84px; resize: vertical; }
.sheet .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sheet .err { color: var(--crit); font-size: 13px; }
.sheet .hint { font-size: 13px; color: var(--muted); }
.sheet .foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.sheet .foot div { display: flex; gap: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 20px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); }

.nav-group { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 2px; font-weight: 500; }
.tablewrap { overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; font-size: 14px; }
.grid th, .grid td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.grid tr:last-child td { border-bottom: 0; }
.grid th { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 500; background: var(--surface-2); white-space: nowrap; }
.grid td.num, .grid th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.grid select { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--surface); color: var(--fg); min-height: 34px; max-width: 190px; }
.toolbar input[type="month"] { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 10px; min-height: 36px; font-size: 14px; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; min-width: 0; }
.bar span { display: block; height: 100%; background: var(--accent); }
.barrow { display: grid; grid-template-columns: minmax(84px, 130px) minmax(0, 1fr) 108px; gap: 10px; align-items: center; font-size: 13px; }
.barrow b { text-align: right; font-weight: 500; }
.row-main > .pill { align-self: flex-start; }
.req { border-top: 1px dashed var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.summary { background: var(--surface-2); border-radius: 6px; padding: 10px 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.filebtn { position: relative; overflow: hidden; display: inline-flex; align-items: center; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.stat { display: flex; flex-wrap: wrap; gap: 12px 28px; }
.stat div { display: flex; flex-direction: column; }
.stat b { font: 500 20px/1.25 var(--mono); }
.stat span { font-size: 12px; color: var(--muted); }
.field-row input[type="file"], .sheet input[type="file"] { padding: 6px; }
.banner .btn { margin-left: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 14px; padding: 3px 10px; font-size: 13px; background: var(--surface-2); }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1; padding: 0 2px; }
.chip button:hover { color: var(--crit); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.prog { display: flex; flex-direction: column; gap: 4px; }
.prog-h { display: flex; align-items: center; gap: 8px; }
.prog-h span { margin-left: auto; font-size: 13px; }
.stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--line); gap: 1px; }
.stack span { min-width: 3px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } .cols { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .main { padding-block: 16px 96px; }
  h1 { font-size: 21px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 500; border-radius: 6px; position: relative; min-width: 0; }
  .tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tab[aria-current="page"] { color: var(--accent); }
  .tab .dot { position: absolute; top: 4px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--crit); }
  .overlay { align-items: flex-end; padding: 0; }
  .sheet { width: 100%; border-radius: 14px 14px 0 0; max-height: 92%; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .sheet .pair { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .btn, .nav, .tile { transition: border-color .12s, background-color .12s; } }
</style>

<div class="app">
  <nav class="rail" id="rail" aria-label="Modules"></nav>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<nav class="tabs" id="tabs" aria-label="Modules"></nav>
<div id="modal"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parse = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = (s, n) => { const d = parse(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return iso(d); };
const diff = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fmt = s => { if (!s) return ''; const d = parse(s); return `${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`; };
const fmtLong = s => { const d = parse(s); return `${DAY[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const weekStart = s => { const d = parse(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
const inr = n => 'Rs ' + new Intl.NumberFormat('en-IN').format(Number(n) || 0);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

const DEF_DEPTS = ['Design', 'R&D', 'Manufacturing', 'QA', 'Purchase', 'HR and admin', 'Finance'];
const DEF_PRIOS = ['Critical', 'High', 'Medium', 'Normal', 'Low', 'Buffer stock'];
const DEF_POTYPES = ['Raw material', 'Component', 'Consumable', 'Packaging', 'Capital equipment', 'Tooling', 'Service', 'Job work'];
const DEF_CATS = ['Raw material', 'Component', 'Sub-assembly', 'Finished goods', 'Consumable', 'Packaging', 'Tooling and spares'];
let DEPTS = DEF_DEPTS, PRIOS = DEF_PRIOS;
const STATUS = { notstarted: 'Not yet started', open: 'Open', progress: 'In progress', pending: 'Pending', blocked: 'Blocked', done: 'Done', dropped: 'Dropped' };
const SOURCES = ['Manual', 'Meeting', 'Email', 'PO', 'Compliance', 'QMS', 'NPD'];
const PO_STEPS = ['Requisition', 'Quotes requested', 'PO drafted', 'Awaiting approval', 'PO released', 'Awaiting delivery', 'Received and inspected', 'Invoice matched', 'Payment approved'];
const PROD_STAGES = ['Requested', 'Released', 'Material issued', 'In process', 'Quality check', 'Completed'];
const GATES = ['Concept', 'Design input', 'Design output', 'Verification', 'Validation', 'Transfer', 'Pilot', 'Mass production'];
const REQ_STATUS = ['Draft', 'Reviewed', 'Approved'];
const FREQ = { monthly: 'Monthly', quarterly: 'Quarterly', yearly: 'Yearly', once: 'One time' };
const MEET_TYPES = ['Daily', 'Weekly', 'MOM', 'CEO review', 'Vendor'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const COLLS = ['people', 'tasks', 'meetings', 'pos', 'vendors', 'items', 'moves', 'compliance', 'projects', 'prod', 'reqs', 'ledger', 'config', 'reviews', 'decisions', 'daily'];
const NAV = [
  ['Daily', [['today', 'Today'], ['approvals', 'Approvals'], ['pending', 'Pending'], ['meetings', 'Meetings']]],

  }

    const mine = openTasks().filter(t => t.ownerId === p.id);
    const late = mine.filter(t => lateBy(t) > 0), now = mine.filter(t => t.due === t0), blocked = mine.filter(t => t.status === 'blocked' && !late.includes(t) && !now.includes(t));
    return { p, late, now, blocked, rest: mine.length - late.length - now.length - blocked.length };
  }).filter(a => a.late.length || a.now.length || a.blocked.length);
}

async function extractActions() {
  if (!sample || S.extracting) return;
  const notes = S.meet.notes.trim();
  if (!notes) { toast('Type or paste the meeting notes first.'); return; }
  S.extracting = true; S.extractErr = ''; render();
  const names = S.data.people.map(p => p.name).join(', ') || '(no team listed)';
  const prompt = `Extract the action items from these meeting notes for a manufacturing team's task tracker.\nToday is ${today()} (${DAY[new Date().getDay()]}). Team members: ${names}.\nReply with only a JSON array. Each element: {"title": string, "owner": string, "due": string}.\n- title: the commitment as a short action, under 100 characters.\n- owner: exactly one of the team member names above, or "" if the notes do not say.\n- due: the date as YYYY-MM-DD if the notes give or imply one, otherwise "".\nInclude only real commitments, one element each. If there are none, reply [].\nExample: [{"title":"Send revised fixture drawing","owner":"Karthik","due":"2026-11-13"}]\n\nNotes:\n${notes.slice(0, 12000)}`;
  try {
    const out = await sample.json(prompt, { modelTier: 'quick', cache: false });
    const arr = Array.isArray(out) ? out : [];
    let n = 0;
    for (const a of arr.slice(0, 30)) {
      const title = String((a && a.title) || '').trim().slice(0, 160); if (!title) continue;
      const who = String((a && a.owner) || '').trim().toLowerCase();
      const owner = who ? S.data.people.find(p => p.name.toLowerCase() === who) || S.data.people.find(p => p.name.toLowerCase().split(' ')[0] === who.split(' ')[0]) : null;
      const due = /^\d{4}-\d{2}-\d{2}$/.test(String((a && a.due) || '')) ? a.due : '';
      S.drafts.push({ on: true, title, ownerId: owner ? owner.id : '', due }); n++;
    }
    S.extractErr = n ? `${plural(n, 'action')} drafted. Check owners and dates before saving.` : 'No action items found in these notes.';
  } catch (e) {
    const code = e && e.code;
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) { sample = null; S.extractErr = 'Claude is not available on this page for you. Add the actions by hand.'; }
    else if (code === 'rate_limited') S.extractErr = 'Claude is busy or at its limit. Try again in a while, or add the actions by hand.';
    else if (code === 'cancelled') S.extractErr = '';

  }

}
async function saveMeeting() {
  const m = S.meet, acts = S.drafts.filter(d => d.on && d.title.trim());
  if (!m.notes.trim() && !acts.length) { toast('Add notes or at least one action.'); return; }
  if (!m.date) { toast('Set the meeting date.'); return; }
  if (acts.some(d => !d.ownerId || !d.due)) { toast('Each action needs an owner and a due date.'); return; }
  try {
    const mid = await put('meetings', null, { date: m.date, type: m.type, notes: m.notes.trim() });
    for (const d of acts) {
      const p = byId('people', d.ownerId);
      await put('tasks', null, { title: d.title.trim(), ownerId: d.ownerId, dept: (p && p.dept) || '', due: d.due, status: 'open', source: 'Meeting', meetingId: mid, createdAt: today() });
    }
    S.meet = { date: today(), type: m.type, notes: '' }; S.drafts = []; S.extractErr = '';
    toast(acts.length ? `Meeting saved with ${plural(acts.length, 'action')}.` : 'Meeting saved.'); render();

}

  await put('items', it.id, { ...it, stock: (Number(it.stock) || 0) + q });

}
async function poNext(id) {
  const p = byId('pos', id); if (!p) return;
  const st = Number(p.step) || 0, rec = { ...p };
  if (st === 3 || st === 7 || st >= 8) return;
  rec.step = st === 0 && p.kind === 'Immediate' ? 2 : st + 1;
  if (rec.step === 1 && !p.quoteRequestedOn) rec.quoteRequestedOn = today();
  try {
    if (rec.step === 6 && !p.receivedOn) { rec.receivedOn = today(); if (!p.stocked && await receiveInto(p.itemId, p.qty, `Received against ${p.number}`)) rec.stocked = true; }
    await put('pos', id, rec); toast(`${p.number}: ${PO_STEPS[rec.step]}.`);
  } catch (e) { /* shown */ }
}

const libs = {};

async function fileText(file, ext) {

  await loadLib(LIB.pdfw); await loadLib(LIB.pdf);

}

}

function allocate(r, rules) {
  const key = r.p.toLowerCase();
  if (rules[key]) return [rules[key], 'Learned'];
  const v = S.data.vendors.find(x => x.name && key.includes(x.name.toLowerCase()));
  if (v) { const po = S.data.pos.filter(p => p.vendorId === v.id && p.dept).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)))[0]; return [po ? po.dept : 'Purchase', 'Vendor']; }
  const hit = KEYWORDS.find(([re]) => re.test(r.p)) || KEYWORDS.find(([re]) => re.test(r.n));
  return hit ? [hit[1], 'Keyword'] : ['', ''];
}
function normDate(v) {
  if (v instanceof Date && !isNaN(v)) { const d = new Date(v.getTime() + 12 * 3600 * 1000); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  const s = String(v || '').trim(); let k = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (k) return `${k[1]}-${pad(k[2])}-${pad(k[3])}`;
  k = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if (k) return `${k[3].length === 2 ? '20' + k[3] : k[3]}-${pad(k[2])}-${pad(k[1])}`;
  k = s.match(/^(\d{1,2})[-\/. ]([A-Za-z]{3})[A-Za-z]*[-\/. ](\d{2,4})/);
  if (k) { const mi = MON.findIndex(x => x.toLowerCase() === k[2].toLowerCase()); if (mi >= 0) return `${k[3].length === 2 ? '20' + k[3] : k[3]}-${pad(mi + 1)}-${pad(k[1])}`; }
  return '';
}

function parseBook(rows) {
  let hi = -1, c = null;
  for (let i = 0; i < Math.min(rows.length, 25) && hi < 0; i++) {
    const r = rows[i].map(x => String(x).toLowerCase());
    const p = r.findIndex(x => /particular|ledger|account|party|description|expense|head|name/.test(x)), a = r.findIndex(x => /debit|amount|\bdr\b|payment|value/.test(x));
    if (p >= 0 && a >= 0 && p !== a) { hi = i; c = { p, a, d: r.findIndex(x => /date/.test(x)), n: r.findIndex((x, j) => j !== p && /narration|remark|note|detail/.test(x)) }; }
  }
  if (hi < 0) return null;
  const out = [];
  for (const r of rows.slice(hi + 1)) {
    const p = String(r[c.p] ?? '').trim(), a = num(r[c.a]);
    if (!p || !(a > 0) || /^(grand |sub ?)?total|^opening|^closing/i.test(p)) continue;
    out.push({ d: c.d >= 0 ? normDate(r[c.d]) : '', p: p.slice(0, 120), n: c.n >= 0 ? String(r[c.n] ?? '').trim().slice(0, 160) : '', a: Math.round(a * 100) / 100, dept: '', via: '' });
  }

}

/* ---------- Department progress and daily trend ---------- */
const SEG = [['done', 'Done this month', 'var(--good)'], ['progress', 'In progress', 'var(--accent)'], ['open', 'Open or not started', 'var(--muted)'], ['pending', 'Pending', 'var(--warn)'], ['blocked', 'Blocked', 'var(--crit)']];
function deptProgress() {
  const m = ym(today());
  return [...DEPTS, ...new Set(S.data.tasks.map(t => t.dept).filter(d => d && !DEPTS.includes(d)))].map(d => {
    const t = S.data.tasks.filter(x => x.dept === d), done = t.filter(x => x.status === 'done' && ym(x.closedAt || '') === m).length, act = t.filter(isOpen), total = done + act.length;
    if (!total) return null;
    const n = st => act.filter(x => x.status === st).length, late = act.filter(x => lateBy(x) > 0);
    return { d, total, done, progress: n('progress'), open: n('open') + n('notstarted'), pending: n('pending'), blocked: n('blocked'), overdue: late.length, pct: Math.round(done / total * 100), level: (n('blocked') || late.some(x => lateBy(x) >= 3)) ? 'red' : late.length ? 'amber' : '' };
  }).filter(Boolean);
}
function progressHtml(rows) {
  if (!rows.length) return emptyBox('Department progress appears once pending items exist.');
  return `<div class="panel-body"><div class="legend">${SEG.map(([, l, c]) => `<span><i style="background:${c}"></i>${l}</span>`).join('')}</div>${rows.map(r => `<div class="prog"><div class="prog-h"><i class="rag ${r.level}"></i><b>${esc(r.d)}</b><span class="mono">${r.pct}% done</span></div>

    <div class="row-meta">${SEG.filter(([k]) => r[k]).map(([k, l]) => `${r[k]} ${l.toLowerCase()}`).join(' · ')}${r.overdue ? ` · ${r.overdue} overdue` : ''}</div></div>`).join('')}</div>`;
}
function trendHtml() {
  const pts = S.data.daily.filter(x => x.date).sort((a, b) => a.date.localeCompare(b.date)).slice(-30);
  if (pts.length < 2) return emptyBox('The hub saves one snapshot of open and overdue items each day it is opened. The trend line appears from the second day.');
  const W = 640, H = 170, px = 34, top = 14, base = H - 26, max = Math.max(4, ...pts.map(p => Math.max(p.open || 0, p.overdue || 0)));
  const x = i => px + i * (W - px - 14) / (pts.length - 1), y = v => base - (v / max) * (base - top), line = k => pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p[k] || 0).toFixed(1)}`).join('');
  const last = pts.at(-1), tick = v => `<line x1="${px}" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${px - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  return `<div class="panel-body"><div class="legend"><span><i style="background:var(--accent)"></i>Open items</span><span><i style="background:var(--crit)"></i>Overdue items</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Open and overdue items per day, ${fmt(pts[0].date)} to ${fmt(last.date)}" style="width:100%;height:auto;display:block">${tick(0)}${tick(Math.round(max / 2))}${tick(max)}
    <path d="${line('open')}" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="${line('overdue')}" fill="none" stroke="var(--crit)" stroke-width="2"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(last.open || 0)}" r="3.5" fill="var(--accent)"/><circle cx="${x(pts.length - 1)}" cy="${y(last.overdue || 0)}" r="3.5" fill="var(--crit)"/>
    <text x="${px}" y="${H - 6}" font-size="11" fill="var(--muted)">${fmt(pts[0].date)}</text><text x="${W - 10}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(last.date)}</text></svg>
    <p class="row-meta">Latest: ${last.open || 0} open, ${last.overdue || 0} overdue, on ${fmt(last.date)}.</p></div>`;
}
/* One snapshot document per day. It is written when the day's counts change, at most once every 30 seconds, so the last value of the day is what the trend keeps. */
let snapAt = 0, snapTimer = 0;
function dailySnap() {
  if (loading() || !S.canWrite || S.mode === 'loading') return;
  const t = openTasks(), cur = byId('daily', today());
  const rec = { date: today(), open: t.length, overdue: t.filter(x => lateBy(x) > 0).length, blocked: t.filter(x => x.status === 'blocked').length, pending: t.filter(x => x.status === 'pending').length };
  if (cur && ['open', 'overdue', 'blocked', 'pending'].every(k => cur[k] === rec[k])) return;
  const wait = snapAt + 30000 - Date.now();
  if (wait > 0) { if (!snapTimer) snapTimer = setTimeout(() => { snapTimer = 0; dailySnap(); }, wait + 50); return; }
  snapAt = Date.now(); rec.byDept = {}; deptProgress().forEach(r => { rec.byDept[r.d] = { open: r.total - r.done, done: r.done, overdue: r.overdue }; });
  if (S.mode === 'live') db.collection('daily').doc(today()).set(rec).catch(() => {});
  else { const i = S.data.daily.findIndex(x => x.id === today()); if (i >= 0) S.data.daily[i] = { id: today(), ...rec }; else S.data.daily.push({ id: today(), ...rec }); }
}

function fieldHtml(f, v) {
  const id = 'f-' + f.k, val = v[f.k] ?? '', req = f.required ? ' *' : '';
  if (f.type === 'check') return `<label class="check"><input type="checkbox" id="${id}" ${val ? 'checked' : ''}>${esc(f.label)}</label>`;
  let ctl;
  if (f.type === 'textarea') ctl = `<textarea id="${id}">${esc(val)}</textarea>`;
  else if (f.type === 'select') ctl = `<select id="${id}">${f.required && !val ? '<option value="">Choose</option>' : ''}${f.options.map(o => { const [k, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(k)}" ${String(val) === String(k) ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
  else if (f.type === 'person') ctl = `<select id="${id}" data-person="1"><option value="">${f.required ? 'Choose' : 'No one'}</option>${S.data.people.map(p => `<option value="${p.id}" ${val === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}<option value="__new">Add a new person…</option></select><input type="text" id="${id}-new" placeholder="New person's name" aria-label="New person's name" hidden>`;
  else if (f.type === 'pick') { const opts = listOf(f.list), all = val && !opts.includes(val) ? [...opts, val] : opts; ctl = `<select id="${id}" data-pick="1"><option value="">${f.required ? 'Choose' : 'None'}</option>${all.map(o => `<option ${String(val) === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}<option value="__new">Add a new option…</option></select><input type="text" id="${id}-new" placeholder="New option" aria-label="New option" hidden>`; }
  else if (f.type === 'file') ctl = `<input type="file" id="${id}" accept="${esc(f.accept || '')}">`;
  else ctl = `<input type="${f.type}" id="${id}" value="${esc(val)}" ${f.type === 'number' ? 'step="any" inputmode="decimal"' : ''}>`;
  return `<label>${esc(f.label)}${req}${ctl}</label>`;
}

const closeForm = () => { S.form = null; $('#modal').innerHTML = ''; };
async function submitForm() {
  const cfg = S.form; if (!cfg) return;
  const err = $('#form-err'), v = {}, flat = cfg.fields.flat();
  const fail = m => { err.textContent = m; err.hidden = false; };
  const newPeople = [], newPicks = [];
  for (const f of flat) {
    const el = document.getElementById('f-' + f.k);
    if (f.type === 'check') { v[f.k] = el.checked; continue; }
    if (f.type === 'file') { v[f.k] = el.files[0] || null; continue; }
    let val = el.value.trim();
    if (f.type === 'person' && val === '__new') {
      const nm = document.getElementById('f-' + f.k + '-new').value.trim();
      if (!nm) return fail('Type the new person\'s name.');
      newPeople.push({ k: f.k, name: nm }); val = '__new';
    }
    if (f.type === 'pick' && val === '__new') {
      val = document.getElementById('f-' + f.k + '-new').value.trim();
      if (!val) return fail('Type the new option.');
      newPicks.push([f.list, val]);
    }
    if (f.required && !val) return fail(`Fill in "${f.label}".`);
    v[f.k] = f.type === 'number' ? (val === '' ? '' : Number(val)) : val;
    if (f.type === 'number' && val !== '' && !isFinite(v[f.k])) return fail(`"${f.label}" must be a number.`);
  }
  const btn = $('#form-save'); btn.disabled = true; err.hidden = true;
  try {
    for (const [l, nv] of newPicks) await addListItem(l, nv);
    for (const np of newPeople) v[np.k] = await put('people', null, { name: np.name, dept: v.dept || '' });
    await cfg.save(v); closeForm(); toast('Saved.');
  } catch (e) { btn.disabled = false; fail(e && e.user ? e.user : 'Could not save. Try again.'); }
}

  const el = ev.target, ds = el.dataset;
  if (ds.m) { S.meet[ds.m] = el.value; return; }
  if (ds.s) { S[ds.s] = el.value; return; }
  if (ds.d != null) { const d = S.drafts[Number(ds.d)]; if (d) { d[ds.k] = el.type === 'checkbox' ? el.checked : el.value; if (el.type === 'checkbox') render(); } return; }
  if (ds.bk != null && S.book) { const r = S.book.rows[Number(ds.bk)]; if (r) { r.dept = el.value; r.via = 'You'; if (el.value) S.learn[r.p.toLowerCase()] = el.value; render(); } return; }
  if (ds.paycol != null && S.pay) { const c = S.pay.heads.find(h => h.i === Number(ds.paycol)); if (c) { c.role = el.value; render(); } return; }
  if (ds.f) { S.f[ds.f] = el.value || (ds.f === 'month' ? ym(today()) : ''); render(); }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.person || el.dataset.pick) { const extra = document.getElementById(el.id + '-new'); if (extra) { extra.hidden = el.value !== '__new'; if (!extra.hidden) extra.focus(); } }
  if (el.type === 'file' && el.files && el.files[0] && !el.closest('#modal')) {
    const file = el.files[0];
    if (el.dataset.up === 'book') bookUpload(file); else if (el.dataset.up === 'pay') payUpload(file); else if (el.dataset.req) attach(el.dataset.req, file); else if (el.dataset.po) attachPo(el.dataset.po, file);
    el.value = '';
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.form) closeForm(); });

init();
})();
</script>
